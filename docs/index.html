<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6ede2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1916" media="(prefers-color-scheme: dark)">
<title>Danke</title>
<link rel="icon" href="assets/favicon.svg?v=043563f480" type="image/svg+xml">
<link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=19a9b67938">
<script type="module" src="assets/app.js?v=740286e10a"></script>
</head>
<body>
<header class="top">
  <button type="button" id="lang" class="lang">English</button>
</header>

<main>
  <section id="welcome" class="card" tabindex="-1" aria-labelledby="title">
    <svg class="emblem" viewBox="0 0 64 48" aria-hidden="true" focusable="false"
      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 16C15 16 8 12 6 3.5M41 16C49 16 56 12 58 3.5"/>
      <path d="M22.7 19.5C18 19 13.5 20.5 11 24c5 1.5 9.3.5 11.5-1.7M41.3 19.5c4.7-.5 9.2 1 11.7 4.5-5 1.5-9.3.5-11.5-1.7"/>
      <path d="M25 34.5C22.5 28.5 21.5 22 23 16c3-2.5 15-2.5 18 0 1.5 6 .5 12.5-2 18.5"/>
      <ellipse cx="32" cy="38.5" rx="7.5" ry="5"/>
      <path d="M28.5 16.5c1.2 1.8 5.8 1.8 7 0"/>
      <circle cx="29" cy="38.8" r=".9" fill="currentColor" stroke="none"/>
      <circle cx="35" cy="38.8" r=".9" fill="currentColor" stroke="none"/>
    </svg>
    <h1 id="title" data-t="title">Danke</h1>
    <p class="lead" data-t="lead"></p>
    <p class="invite" data-t="invite"></p>

    <form id="form" novalidate>
      <label for="code" data-t="label">Persönlicher Code</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXXX-XXXXX"
        aria-describedby="hint status">
      <p id="hint" class="hint" data-t="hint"></p>
      <button type="submit" id="submit" data-t="open">Nachricht öffnen</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <article id="message" class="card message" tabindex="-1" hidden></article>
</main>

<noscript>
  <style>main, .top { display: none; }</style>
  <p class="noscript">Diese Seite benötigt JavaScript. · This page requires JavaScript.</p>
</noscript>
</body>
</html>
