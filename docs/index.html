<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<body>
<header class="top">
  <button type="button" id="lang" class="lang">English</button>
</header>

<main>
  <section id="welcome" class="card" tabindex="-1" aria-labelledby="title">
    <svg class="emblem" viewBox="0 0 54 48" aria-hidden="true" focusable="false"
      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 8 22 3.8M31 8l1-4.2"/>
      <path d="M17.5 12.5C14 10.5 10 11 8 13.5c3 2 6.5 2 9.5.5M36.5 12.5c3.5-2 7.5-1.5 9.5 1-3 2-6.5 2-9.5.5"/>
      <path d="M20 23.5C18 21.5 17 19.5 17 17c0-6 4.5-10 10-10s10 4 10 10c0 2.5-1 4.5-3 6.5"/>
      <ellipse cx="27" cy="26" rx="7.5" ry="5.5"/>
      <path d="M25 28.4c1.2.9 2.8.9 4 0"/>
      <path d="M21 31.5 20 44M33 31.5 34 44"/>
      <circle cx="21.8" cy="2.6" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="32.2" cy="2.6" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="22.4" cy="16.5" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="31.6" cy="16.5" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="24.6" cy="25" r=".7" fill="currentColor" stroke="none"/>
      <circle cx="29.4" cy="25" r=".7" fill="currentColor" stroke="none"/>
      <circle cx="24" cy="37" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="30" cy="40.5" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    <h1 id="title" data-t="title">Danke</h1>
    <p class="lead" data-t="lead"></p>
    <p class="invite" data-t="invite"></p>

    <form id="form" novalidate>
      <label for="code" data-t="label">Persönlicher Code</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXXX-XXXXX"
        aria-describedby="hint status">
      <p id="hint" class="hint" data-t="hint"></p>
      <button type="submit" id="submit" data-t="open">Nachricht öffnen</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <article id="message" class="card message" tabindex="-1" hidden></article>
</main>

<noscript>
  <style>main, .top { display: none; }</style>
