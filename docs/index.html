<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6ede2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1916" media="(prefers-color-scheme: dark)">
<title>Danke</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<header class="top">
  <button type="button" id="lang" class="lang">English</button>
</header>

<main>
  <section id="welcome" class="card" tabindex="-1" aria-labelledby="title">
    <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path d="M8 7c0 9.5 7 14 16 14s16-4.5 16-14"/>
      <circle cx="24" cy="31.5" r="10.5"/>
    </svg>
    <h1 id="title" data-t="title">Danke</h1>
    <p class="lead" data-t="lead"></p>
    <p class="invite" data-t="invite"></p>

    <form id="form" novalidate>
      <label for="code" data-t="label">Persönlicher Code</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXXX-XXXXX"
        aria-describedby="hint status">
      <p id="hint" class="hint" data-t="hint"></p>
      <button type="submit" id="submit" data-t="open">Nachricht öffnen</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <article id="message" class="card message" tabindex="-1" hidden></article>
</main>

<noscript>
  <style>main, .top { display: none; }</style>
  <p class="noscript">Diese Seite benötigt JavaScript. · This page requires JavaScript.</p>
</noscript>
</body>
</html>
